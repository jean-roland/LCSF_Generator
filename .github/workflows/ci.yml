# Build and test on Linux and Windows. A version tag (e.g. 1.5) also drafts the GitHub release with both archives.
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make_release.sh drafts the notes from the previous tag
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build qtbase5-dev
      - name: Build, test and package
        run: ./make_release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/RELEASE_NOTES_*.md

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and its MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true
      # The Qt MinGW ahead of the one the runner ships, the Qt binaries are built with it
      - name: Use the Qt MinGW
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw810_64\bin"
      - name: Build
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Test
        working-directory: build/bin
        run: ./lcsf_generator_tests.exe
      - name: Package
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'LCSF_Generator VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "LCSF_Generator-$ver-windows-x86_64"
          cmake --install build --prefix "dist/$name"
          # The MinGW import library is only for linking against the dll
          Remove-Item -Recurse "dist/$name/lib"
          # Qt and MinGW runtime dlls listed by hand: the Qt 5.15 windeployqt did not find the platform plugin here
          $qt = $env:QT_ROOT_DIR
          $bin = "dist/$name/bin"
          Copy-Item "$qt/bin/Qt5Core.dll", "$qt/bin/Qt5Gui.dll", "$qt/bin/Qt5Widgets.dll", "$qt/bin/libgcc_s_seh-1.dll",
            "$qt/bin/libstdc++-6.dll", "$qt/bin/libwinpthread-1.dll" $bin
          New-Item -ItemType Directory "$bin/platforms", "$bin/styles" | Out-Null
          Copy-Item "$qt/plugins/platforms/qwindows.dll" "$bin/platforms"
          Copy-Item "$qt/plugins/styles/qwindowsvistastyle.dll" "$bin/styles"
          Copy-Item README.md, LICENCE.md "dist/$name"
          # Smoke test with Qt off the path: the archive must carry every dll the CLI loads
          $env:PATH = "$env:SystemRoot\system32"
          & "$bin/lcsf_generator_cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A draft: the notes are a git log summary, curate them before publishing
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip
          --repo "$GITHUB_REPOSITORY" --draft --title "v$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES_*.md
